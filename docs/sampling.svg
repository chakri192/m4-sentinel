<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#7ddc8b"/></marker>
  </defs>

  <rect width="880" height="440" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="439" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">WHY ONE READING ISN'T A CPU LOAD</text>

  <!-- ── the tick timeline ── -->
  <text x="28" y="70" font-size="10.5" fill="#8a9bb4">Mach's per-core counters are cumulative since boot. Read once, you get the machine's lifetime average — a number that barely moves.</text>

  <line x1="46" y1="118" x2="600" y2="118" stroke="#39414f" stroke-width="1.5"/>
  <text x="46" y="140" font-size="9" fill="#5d6675">boot</text>
  <text x="600" y="140" font-size="9" fill="#5d6675" text-anchor="end">now</text>

  <circle cx="470" cy="118" r="4.5" fill="#5fd0de"/>
  <circle cx="546" cy="118" r="4.5" fill="#5fd0de"/>
  <text x="470" y="106" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5fd0de" text-anchor="middle">t₀</text>
  <text x="546" y="106" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5fd0de" text-anchor="middle">t₁</text>

  <path d="M470 128 L470 152 M546 128 L546 152" stroke="#5fd0de" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M470 146 L546 146" stroke="#5fd0de" stroke-width="1.3"/>
  <text x="508" y="166" font-size="9.5" fill="#5fd0de" text-anchor="middle">200 ms</text>

  <text x="624" y="112" font-size="10" fill="#7d8899">the only window that</text>
  <text x="624" y="126" font-size="10" fill="#7d8899">describes right now</text>

  <rect x="46" y="182" width="554" height="34" rx="6" fill="#12151b" stroke="#39414f"/>
  <text x="323" y="203" font-size="10.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7ddc8b" text-anchor="middle">load = Δ(user + system) / Δ(user + system + idle)   ← summed across every core</text>

  <!-- ── the loop ── -->
  <text x="28" y="256" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">ONE PASS</text>

  <rect x="28" y="272" width="138" height="70" rx="8" fill="#12151b" stroke="#5fd0de" stroke-width="1.3"/>
  <text x="97" y="292" font-size="10.5" font-weight="700" fill="#5fd0de" text-anchor="middle">sample CPU twice</text>
  <text x="97" y="310" font-size="8.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">host_processor_info</text>
  <text x="97" y="326" font-size="9" fill="#8a9bb4" text-anchor="middle">deallocates the array after</text>

  <rect x="187" y="272" width="186" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="280" y="292" font-size="10.5" font-weight="700" fill="#e6edf3" text-anchor="middle">read both sensors</text>
  <text x="280" y="309" font-size="8.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">thermal · notify_get_state</text>
  <text x="280" y="322" font-size="8.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">memory · memorystatus sysctl</text>
  <text x="280" y="336" font-size="9" fill="#8a9bb4" text-anchor="middle">separate levels, separate labels</text>

  <rect x="394" y="272" width="173" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="480" y="292" font-size="10.5" font-weight="700" fill="#e6edf3" text-anchor="middle">append a line</text>
  <text x="480" y="310" font-size="8" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">~/Library/Logs/m4_sentinel.log</text>
  <text x="480" y="326" font-size="9" fill="#8a9bb4" text-anchor="middle">opened and closed each pass</text>

  <rect x="588" y="272" width="153" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="664" y="292" font-size="10.5" font-weight="700" fill="#e6edf3" text-anchor="middle">notify, if it rises</text>
  <text x="664" y="310" font-size="8.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899" text-anchor="middle">osascript notification</text>
  <text x="664" y="326" font-size="9" fill="#8a9bb4" text-anchor="middle">edge-triggered, not every pass</text>

  <rect x="762" y="272" width="88" height="70" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="806" y="300" font-size="10.5" font-weight="700" fill="#e6edf3" text-anchor="middle">sleep 60</text>
  <text x="806" y="318" font-size="8.5" fill="#8a9bb4" text-anchor="middle">daemon mode only</text>

  <line x1="168" y1="307" x2="185" y2="307" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="375" y1="307" x2="392" y2="307" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="569" y1="307" x2="586" y2="307" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="743" y1="307" x2="760" y2="307" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>

  <path d="M806 342 V 372 H 97 V 348" stroke="#7ddc8b" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <text x="450" y="366" font-size="9.5" fill="#7ddc8b" text-anchor="middle">repeat</text>

  <line x1="28" y1="396" x2="852" y2="396" stroke="#2b313d"/>
  <text x="28" y="418" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">--daemon:  fflush(NULL) → fork() → setsid() → chdir("/") → reopen stdin/stdout/stderr on /dev/null</text>
  <text x="852" y="418" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5d6675" text-anchor="end">C11 · 291 lines</text>
</svg>
