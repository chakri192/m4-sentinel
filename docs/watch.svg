<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280">
  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f7d5e" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#5fd0de" stop-opacity="0.85"/>
      <stop offset="62%" stop-color="#f0b866"/>
      <stop offset="82%" stop-color="#f2707c"/>
      <stop offset="100%" stop-color="#f2707c" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b866" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f0b866" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warn">
      <stop offset="0%" stop-color="#f2707c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f2707c" stop-opacity="0"/>
    </radialGradient>
    <filter id="gg"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="f"><rect width="880" height="280" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#f)">
    <rect width="880" height="280" fill="#07090c"/>
    <ellipse cx="716" cy="130" rx="240" ry="150" fill="url(#warn)"/>

    <!-- faint grid, like an instrument -->
    <g stroke="#1a2028" stroke-width="1">
      <path d="M0 70 H880 M0 140 H880 M0 210 H880"/>
      <path d="M110 0 V280 M220 0 V280 M330 0 V280 M440 0 V280 M550 0 V280 M660 0 V280 M770 0 V280"/>
    </g>

    <!-- the trace: quiet, then a climb -->
    <path d="M0 186 L60 182 L96 190 L140 178 L184 188 L226 174 L268 184 L312 168 L356 180 L400 160 L440 172 L478 140 L512 156 L548 116 L584 132 L618 92 L652 108 L688 70 L722 88 L758 52 L796 72 L836 44 L880 62 L880 280 L0 280 Z"
          fill="url(#under)"/>
    <path d="M0 186 L60 182 L96 190 L140 178 L184 188 L226 174 L268 184 L312 168 L356 180 L400 160 L440 172 L478 140 L512 156 L548 116 L584 132 L618 92 L652 108 L688 70 L722 88 L758 52 L796 72 L836 44 L880 62"
          fill="none" stroke="url(#trace)" stroke-width="2.6" stroke-linejoin="round" filter="url(#gg)" opacity="0.75"/>
    <path d="M0 186 L60 182 L96 190 L140 178 L184 188 L226 174 L268 184 L312 168 L356 180 L400 160 L440 172 L478 140 L512 156 L548 116 L584 132 L618 92 L652 108 L688 70 L722 88 L758 52 L796 72 L836 44 L880 62"
          fill="none" stroke="url(#trace)" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- the line it is about to cross -->
    <path d="M0 76 H880" stroke="#f2707c" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="8 6"/>
    <circle cx="758" cy="52" r="4.6" fill="#f2707c"/>
    <circle cx="758" cy="52" r="14" fill="#f2707c" opacity="0.25" filter="url(#gg)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="279" rx="10" fill="none" stroke="#22242b"/>
</svg>
